# =============================================================================
# Finance Sample App — batch-processor (Java / Spring Batch)
# =============================================================================
# Nightly reconciliation and settlement batch job. Responsibilities:
#   - End-of-day reconciliation (ReconciliationJob)
#   - Monthly statement generation (StatementJob)
#   - Reads/writes to the `ledger` PostgreSQL database
#
# Exposes an HTTP port (8083) for two purposes:
#   - On-demand job triggers: POST /jobs/reconciliation, POST /jobs/statement
#     (see BatchJobController) — used by the traffic generator so this demo
#     produces batch.job / batch.step spans without waiting for a cron.
#   - Spring Boot Actuator health/metrics endpoints.
# In production, prefer scheduling via @Scheduled cron or a Kubernetes CronJob
# and treat the HTTP trigger as a manual/demo-only escape hatch.
#
# Resource limits are intentionally higher than other services because batch
# jobs are CPU and memory intensive during peak processing windows.
#
# NOTE: For production, consider running batch jobs as a Kubernetes CronJob
# instead of a long-running Deployment, so pods are created on demand and
# resources are released after each run.
# =============================================================================

# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: batch-processor
  namespace: finance
  labels:
    app: batch-processor
    component: service
spec:
  type: ClusterIP
  selector:
    app: batch-processor
  ports:
    - name: http
      port: 8083
      targetPort: 8083

---
# ── Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-processor
  namespace: finance
  labels:
    app: batch-processor
    component: service
spec:
  # Only one instance should run at a time to prevent duplicate batch runs.
  replicas: 1
  selector:
    matchLabels:
      app: batch-processor
  template:
    metadata:
      annotations:
        # Datadog single-step instrumentation — inject java tracer at pod startup.
        # Pinned to the tracer's MAJOR version (Datadog publishes floating vN
        # init-image tags). More reproducible than "latest" (no surprise major
        # bumps) while still receiving patches; always resolvable — unlike exact
        # patch tags, which don't reliably exist as init-image tags.
        # ── DATADOG INSTRUMENTATION (Single Step library version) ────────
        # Uncomment via 'make instrument' together with the
        # admission.datadoghq.com/enabled label below — tells the Admission
        # Controller webhook which tracer library to inject into this pod.
        # Docs: https://docs.datadoghq.com/tracing/trace_collection/automatic_instrumentation/single-step-apm/
        #
        # admission.datadoghq.com/java-lib.version: "v1"
        # ─────────────────────────────────────────────────────────────────
        # ── DATADOG LOG COLLECTION (autodiscovery annotation) ────────────
        # Uncomment via 'make tags' to tell the Agent which log source and
        # service to tag this pod's stdout/stderr logs with — required for
        # correct parsing/faceting in Log Management.
        # Docs: https://docs.datadoghq.com/containers/kubernetes/log/
        #
        # ad.datadoghq.com/batch-processor.logs: '[{"source":"java","service":"batch-processor"}]'
        # ─────────────────────────────────────────────────────────────────
      labels:
        app: batch-processor
        component: service
        # ── DATADOG INSTRUMENTATION (Single Step Instrumentation) ────────
        # Uncomment via 'make instrument' to opt this pod into the Admission
        # Controller webhook — injects the Datadog tracer at pod startup
        # (APM traces, log-trace correlation, runtime metrics; no code
        # changes, no rebuild required).
        # Docs: https://docs.datadoghq.com/tracing/trace_collection/automatic_instrumentation/single-step-apm/
        #
        # admission.datadoghq.com/enabled: "true"
        # ─────────────────────────────────────────────────────────────────
        # ── DATADOG UST (Unified Service Tagging) ────────────────────────
        # Uncomment via 'make tags' to set the tags.datadoghq.com/* pod
        # labels used for Deployment Tracking / trace-log-metric correlation.
        # Docs: https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/
        #
        # tags.datadoghq.com/env: "staging"
        # tags.datadoghq.com/service: "batch-processor"
        # tags.datadoghq.com/version: "latest"
        # ─────────────────────────────────────────────────────────────────
    spec:
      # Wait for PostgreSQL before starting Spring Batch — it creates
      # its metadata tables on first run (initialize-schema: always).
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              'until nc -z postgres-ledger 5432; do echo "waiting for postgres..."; sleep 3; done',
            ]
      containers:
        - name: batch-processor
          image: finance-sample-app-batch-processor:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8083

          env:
            # ── Spring Boot DataSource ────────────────────────────────────────
            # Spring Boot auto-configures a DataSource from these properties.
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-password

            # ── DATADOG INSTRUMENTATION (Unified Service Tagging) ───────────
            # Uncomment via 'make tags' to set DD_ENV/DD_SERVICE/DD_VERSION —
            # required for APM/logs/metrics correlation and Deployment
            # Tracking. Docs: https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/
            #
            # - name: DD_ENV
            #   value: "staging"
            # - name: DD_SERVICE
            #   value: "batch-processor"
            # - name: DD_VERSION
            #   value: "latest"
            # ─────────────────────────────────────────────────────────────────
            # DD_AGENT_HOST uses the node's IP so the pod sends traces/metrics
            # to the DaemonSet agent running on the same node.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # ── DATADOG INSTRUMENTATION (log injection) ─────────────────────
            # Uncomment via 'make tags' to inject dd.trace_id / dd.span_id
            # into Spring Batch job logs via dd-trace-java's MDC integration —
            # stitches JSON logs to APM traces ("View in APM" from Logs).
            # Java has no source-level patch_logging() equivalent — this is
            # the only switch needed.
            # Docs: https://docs.datadoghq.com/tracing/other_telemetry/connect_logs_and_traces/?tab=java
            #
            # - name: DD_LOGS_INJECTION
            #   value: "true"
            # ─────────────────────────────────────────────────────────────────
            # ── DATADOG INSTRUMENTATION (Application Security Management) ───
            # Uncomment via 'make security' to enable AppSec threat detection
            # in the tracer. Works alongside the Agent-side asm.threats
            # feature in datadog-agent.yaml. Detects SQLi, XSS, SSRF and
            # business-logic attacks at runtime.
            # Docs: https://docs.datadoghq.com/security/application_security/
            #
            # - name: DD_APPSEC_ENABLED
            #   value: "true"
            # ─────────────────────────────────────────────────────────────────
            # ── DATA JOBS MONITORING (DJM) ──────────────────────────────────
            # Uncomment via 'make instrument' to surface Spring Batch job runs
            # under APM > Data Jobs. Equivalent to the
            # -Ddd.data.jobs.enabled=true JVM flag; no rebuild needed.
            # Docs: https://docs.datadoghq.com/data_jobs/
            #
            # - name: DD_DATA_JOBS_ENABLED
            #   value: "true"
            # ─────────────────────────────────────────────────────────────────
            # ── CONTINUOUS PROFILER ──────────────────────────────────────────
            # Uncomment via 'make instrument' to enable Continuous Profiler for
            # this service — correlate CPU flame graphs with slow batch steps.
            # Single Step Instrumentation already injects dd-java-agent for
            # Java APM; dd-java-agent honors DD_PROFILING_ENABLED as a plain
            # env var, no JVM flag / Dockerfile changes needed.
            # Docs: https://docs.datadoghq.com/profiler/
            #
            # - name: DD_PROFILING_ENABLED
            #   value: "true"
            # ─────────────────────────────────────────────────────────────────
          # HTTP probes against Spring Boot Actuator — batch-processor now
          # runs an embedded web server (spring-boot-starter-web) to expose
          # the on-demand job trigger endpoints (/jobs/reconciliation,
          # /jobs/statement) alongside /actuator/health.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
